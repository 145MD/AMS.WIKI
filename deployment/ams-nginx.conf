# /etc/nginx/sites-available/api.classpass.lk
#
# API-only vhost. The PWA is served by Cloudflare Pages from portal.classpass.lk
# and *.classpass.lk; nginx no longer fronts any static assets.
#
# Cloudflare proxies every request (orange cloud) so:
#   * real_ip_header is CF-Connecting-IP
#   * set_real_ip_from is restricted to Cloudflare's published IP ranges
#     (keep in sync with the Cloudflare:KnownNetworks list in appsettings)
#   * the API behind this vhost reads X-Forwarded-* via UseForwardedHeaders
#     in Program.cs

# --- HTTP → HTTPS redirect (Cloudflare Full/Strict still talks HTTPS to origin,
#     but Let's Encrypt HTTP-01 challenges might go through bare 80; keep open) ---
server {
    listen 80;
    listen [::]:80;
    server_name api.classpass.lk;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.classpass.lk;

    # certbot --dns-cloudflare issues these; renewal hook reloads nginx.
    ssl_certificate     /etc/letsencrypt/live/api.classpass.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.classpass.lk/privkey.pem;

    # --- Security response headers (SEC-13) ---
    # `always` so they are emitted on error responses too. HSTS is set by the API
    # itself (UseHsts) and passes through this proxy, so it is intentionally NOT
    # duplicated here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # This vhost only serves the JSON API; deny framing / plugin embedding outright.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Cap request bodies to blunt upload-based DoS. Keep in sync with the largest
    # DocumentService category limit (raise if you accept larger uploads).
    client_max_body_size 25m;

    # Trust Cloudflare-only for client IP forwarding.
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    # IPv4 ranges (https://www.cloudflare.com/ips-v4)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6 ranges (https://www.cloudflare.com/ips-v6)
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Health probe — used by uptime monitors; not proxied through CF auth rules.
    location /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;

        # Pass the (already-real) client IP and the original host/scheme so
        # ASP.NET UseForwardedHeaders + TenantResolutionMiddleware see them.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_cache_bypass $http_upgrade;
    }
}
